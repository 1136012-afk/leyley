<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星際躲避者 - 網頁小遊戲</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #game-container {
            position: relative;
        }
        canvas {
            border: 2px solid #444;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            cursor: none; /* 隱藏滑鼠，用飛船代替 */
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
        }
        .msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #00ffff;
            border: none;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div id="ui">分數: <span id="score">0</span></div>
    
    <div id="start-msg" class="msg" style="display: block;">
        <h2>星際躲避者</h2>
        <p>移動滑鼠控制飛船，躲避隕石！</p>
        <button onclick="startGame()">開始遊戲</button>
    </div>

    <div id="over-msg" class="msg">
        <h2>遊戲結束</h2>
        <p>最終分數: <span id="final-score">0</span></p>
        <button onclick="startGame()">再試一次</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const startMsg = document.getElementById('start-msg');
    const overMsg = document.getElementById('over-msg');
    const finalScoreElement = document.getElementById('final-score');

    let score = 0;
    let gameActive = false;
    let player = { x: 200, y: 500, size: 20 };
    let enemies = [];
    let animationId;

    // 監聽滑鼠移動
    canvas.addEventListener('mousemove', (e) => {
        if (!gameActive) return;
        const rect = canvas.getBoundingClientRect();
        player.x = e.clientX - rect.left;
        player.y = e.clientY - rect.top;
    });

    function startGame() {
        score = 0;
        enemies = [];
        gameActive = true;
        scoreElement.textContent = score;
        startMsg.style.display = 'none';
        overMsg.style.display = 'none';
        update();
    }

    function createEnemy() {
        if (Math.random() < 0.05) { // 生成頻率
            const size = Math.random() * 30 + 10;
            enemies.push({
                x: Math.random() * canvas.width,
                y: -size,
                size: size,
                speed: Math.random() * 3 + 2 + (score / 500) // 隨分數增加速度
            });
        }
    }

    function update() {
        if (!gameActive) return;

        // 清除畫布
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 繪製玩家 (飛船)
        ctx.fillStyle = '#00ffff';
        ctx.beginPath();
        ctx.moveTo(player.x, player.y - player.size);
        ctx.lineTo(player.x - player.size, player.y + player.size);
        ctx.lineTo(player.x + player.size, player.y + player.size);
        ctx.fill();

        // 處理敵人
        createEnemy();
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.y += e.speed;

            // 繪製敵人 (隕石)
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            ctx.arc(e.x, e.y, e.size / 2, 0, Math.PI * 2);
            ctx.fill();

            // 碰撞偵測 (圓形碰撞)
            let dx = player.x - e.x;
            let dy = player.y - e.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < (player.size / 2 + e.size / 2)) {
                gameOver();
            }

            // 移除超出螢幕的敵人並加分
            if (e.y > canvas.height) {
                enemies.splice(i, 1);
                score += 10;
                scoreElement.textContent = score;
            }
        }

        animationId = requestAnimationFrame(update);
    }

    function gameOver() {
        gameActive = false;
        cancelAnimationFrame(animationId);
        finalScoreElement.textContent = score;
        overMsg.style.display = 'block';
    }
</script>

</body>
</html>
